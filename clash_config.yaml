# ============================================================
# 规则库：策略组（proxy-groups）+ 规则集（rule-providers，全部 MRS）+ 路由规则（rules）
# 规则集名、策略组名被 rules 和配置库的 DNS 引用，名称请勿改动
# ============================================================

# ---------- 策略组 ----------
# include-all: true 自动收录节点库里的全部节点与订阅；exclude-filter 过滤“剩余流量/到期时间”等信息节点
proxy-groups:
  # 日常总出口：自动 / 地区 / 手动选节点
  - name: PROXY
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Final.png
    proxies:
      - AUTO
      - HK-Auto
      - JP-Auto
      - SG-Auto
      - US-Auto
      - TW-Auto
      - DIRECT
    include-all: true
    exclude-filter: "(?i)剩余|流量|到期|过期|官网|套餐|重置|expire|traffic|reset"

  # 全部节点自动测速，选最快
  - name: AUTO
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Global.png
    include-all: true
    exclude-filter: "(?i)剩余|流量|到期|过期|官网|套餐|重置|expire|traffic|reset"
    lazy: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  # 地区自动组（节点名需含对应关键词才会进入）
  - name: HK-Auto
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Hong_Kong.png
    include-all: true
    filter: '(?i)香港|\bHK\b|Hong ?Kong|🇭🇰'
    lazy: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: JP-Auto
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Japan.png
    include-all: true
    filter: '(?i)日本|东京|大阪|\bJP\b|Japan|🇯🇵'
    lazy: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: SG-Auto
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Singapore.png
    include-all: true
    filter: '(?i)新加坡|狮城|\bSG\b|Singapore|🇸🇬'
    lazy: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: US-Auto
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/United_States.png
    include-all: true
    filter: '(?i)美国|洛杉矶|圣何塞|\bUS\b|United ?States|America|🇺🇸'
    lazy: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: TW-Auto
    type: url-test
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Taiwan.png
    include-all: true
    filter: '(?i)台湾|台灣|\bTW\b|Taiwan|🇹🇼'
    lazy: true
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  # 按服务分组（彼此独立，切换 PROXY 不会覆盖它们）
  - name: AI
    type: select
    icon: https://fastly.jsdelivr.net/gh/shindgewongxj/WHATSINStash/icon/openai.png
    proxies: [US-Auto, JP-Auto, SG-Auto, PROXY]

  - name: Streaming
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Netflix.png
    proxies: [PROXY, HK-Auto, JP-Auto, SG-Auto, US-Auto, TW-Auto]

  - name: Telegram
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Telegram.png
    proxies: [PROXY, SG-Auto, HK-Auto, US-Auto]

  - name: Apple
    type: select
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Apple.png
    proxies: [DIRECT, PROXY]

# ---------- 规则集 ----------
# MRS 仅支持 domain / ipcidr；behavior、format 必须与文件实际内容一致
# 使用 jsDelivr 镜像，国内网络比 raw.githubusercontent.com 稳定
rule-providers:
  private:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs"
    path: ./ruleset/private.mrs
    interval: 86400
  ads:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.mrs"
    path: ./ruleset/ads.mrs
    interval: 86400
  openai:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/openai.mrs"
    path: ./ruleset/openai.mrs
    interval: 86400
  telegram:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.mrs"
    path: ./ruleset/telegram.mrs
    interval: 86400
  telegram-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs"
    path: ./ruleset/telegram-ip.mrs
    interval: 86400
  youtube:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/youtube.mrs"
    path: ./ruleset/youtube.mrs
    interval: 86400
  netflix:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/netflix.mrs"
    path: ./ruleset/netflix.mrs
    interval: 86400
  github:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs"
    path: ./ruleset/github.mrs
    interval: 86400
  apple:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs"
    path: ./ruleset/apple.mrs
    interval: 86400
  geolocation-not-cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.mrs"
    path: ./ruleset/geolocation-not-cn.mrs
    interval: 86400
  cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"
    path: ./ruleset/cn.mrs
    interval: 86400
  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"
    path: ./ruleset/cn-ip.mrs
    interval: 86400

# ---------- 路由规则（自上而下，首条命中即生效） ----------
rules:
  # 1. 局域网 / 本机直连
  - RULE-SET,private,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve

  # 2. Apple 推送直连（避免推送延迟/掉线）
  - DOMAIN-SUFFIX,push.apple.com,DIRECT

  # 3. 广告拦截
  - RULE-SET,ads,REJECT

  # 4. 明确的海外服务
  - RULE-SET,openai,AI
  - DOMAIN-SUFFIX,anthropic.com,AI
  - DOMAIN-SUFFIX,claude.ai,AI
  - DOMAIN-SUFFIX,claude.com,AI
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram-ip,Telegram,no-resolve
  - RULE-SET,youtube,Streaming
  - RULE-SET,netflix,Streaming
  - RULE-SET,github,PROXY
  - RULE-SET,apple,Apple
  - RULE-SET,geolocation-not-cn,PROXY

  # 5. 中国大陆直连
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve

  # 6. 兜底
  - MATCH,PROXY
