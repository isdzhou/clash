    interval: 86400

  telegram-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs"
    path: ./ruleset/telegram-ip.mrs
    interval: 86400

  youtube:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/youtube.mrs"
    path: ./ruleset/youtube.mrs
    interval: 86400

  netflix:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/netflix.mrs"
    path: ./ruleset/netflix.mrs
    interval: 86400

  github:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.mrs"
    path: ./ruleset/github.mrs
    interval: 86400

  apple:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.mrs"
    path: ./ruleset/apple.mrs
    interval: 86400

  # Microsoft 规则集
  microsoft:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.mrs"
    path: ./ruleset/microsoft.mrs
    interval: 86400

  # Spotify 规则集
  spotify:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/spotify.mrs"
    path: ./ruleset/spotify.mrs
    interval: 86400

  geolocation-not-cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.mrs"
    path: ./ruleset/geolocation-not-cn.mrs
    interval: 86400

  cn:
    type: http
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"
    path: ./ruleset/cn.mrs
    interval: 86400

  cn-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.mrs"
    path: ./ruleset/cn-ip.mrs
    interval: 86400

# ---------- 路由规则 ----------
# 自上而下匹配，首条命中即生效

rules:
  # 1. 局域网 / 本机直连
  - RULE-SET,private,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve

  # 2. Apple 推送直连
  - DOMAIN-SUFFIX,push.apple.com,DIRECT

  # 3. Spotify 广告拦截
  - DOMAIN-SUFFIX,ads-fa.spotify.com,REJECT

  # 4. 全局广告拦截
  - RULE-SET,ads,REJECT

  # 5. AI 服务
  - RULE-SET,openai,AI
  - DOMAIN-SUFFIX,anthropic.com,AI
  - DOMAIN-SUFFIX,claude.ai,AI
  - DOMAIN-SUFFIX,claude.com,AI

  # 6. Telegram
  - RULE-SET,telegram,Telegram
  - RULE-SET,telegram-ip,Telegram,no-resolve

  # 7. 视频流媒体
  - RULE-SET,youtube,Streaming
  - RULE-SET,netflix,Streaming

  # 8. GitHub
  - RULE-SET,github,PROXY

  # 9. Apple
  - RULE-SET,apple,Apple

  # 10. Microsoft 独立分流
  - RULE-SET,microsoft,Microsoft

  # 11. Spotify 独立分流
  - RULE-SET,spotify,Spotify

  # 12. 其他海外网站
  - RULE-SET,geolocation-not-cn,PROXY

  # 13. 中国大陆直连
  - RULE-SET,cn,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve

  # 14. 兜底
  - MATCH,PROXY
